<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break Room - Connection Test</title>
<style>
  body { font-family: system-ui, sans-serif; background: #1b1b1f; color: #eee; max-width: 560px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 1.3rem; }
  .row { padding: 12px 14px; margin: 10px 0; border-radius: 8px; background: #2a2a31; }
  .ok { border-left: 5px solid #3ecf6e; }
  .bad { border-left: 5px solid #ff5a5a; }
  .wait { border-left: 5px solid #e0b43a; }
  small { color: #aaa; display: block; margin-top: 4px; }
  #verdict { font-size: 1.1rem; font-weight: bold; margin-top: 24px; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: #4a7cff; color: #fff; font-size: 1rem; cursor: pointer; }
</style>
</head>
<body>
<h1>Break Room: live quiz connection test</h1>
<p>Open this on a work machine, on the work network. It takes a few seconds.</p>

<div id="r1" class="row wait">1. Loading Firebase library...</div>
<div id="r2" class="row wait">2. Connecting to the database...</div>
<div id="r3" class="row wait">3. Writing a test value...</div>
<div id="r4" class="row wait">4. Reading it back...</div>
<div id="verdict"></div>
<p><button onclick="location.reload()">Run again</button></p>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" onerror="libFail()"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js" onerror="libFail()"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyCrqeyETcZ0GfSFiBttWUSzGemjj6N3wo4",
  authDomain: "the-break-room-quiz.firebaseapp.com",
  databaseURL: "https://the-break-room-quiz-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "the-break-room-quiz",
  storageBucket: "the-break-room-quiz.firebasestorage.app",
  messagingSenderId: "281340957542",
  appId: "1:281340957542:web:a7249f516408983fd9aea7"
};

function set(id, cls, text, note) {
  const el = document.getElementById(id);
  el.className = 'row ' + cls;
  el.innerHTML = text + (note ? '<small>' + note + '</small>' : '');
}
function libFail() {
  set('r1', 'bad', '1. Could not load the Firebase library', 'The work network is probably blocking gstatic.com. Live mode would not work here.');
  document.getElementById('verdict').textContent = 'RESULT: FAIL at step 1';
}

window.addEventListener('load', async () => {
  if (typeof firebase === 'undefined') return;
  set('r1', 'ok', '1. Firebase library loaded');

  try {
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let connected = false;

    const connTimeout = setTimeout(() => {
      if (!connected) {
        set('r2', 'bad', '2. No connection after 10 seconds', 'Either the work network blocks Firebase, or the databaseURL is wrong (check the ending of the URL).');
        document.getElementById('verdict').textContent = 'RESULT: FAIL at step 2';
      }
    }, 10000);

    db.ref('.info/connected').on('value', async (snap) => {
      if (!snap.val() || connected) return;
      connected = true;
      clearTimeout(connTimeout);
      set('r2', 'ok', '2. Connected to the database');

      try {
        const t0 = performance.now();
        const stamp = Date.now();
        const ref = db.ref('connectionTest/ping');
        await ref.set({ stamp: stamp, from: 'test page' });
        set('r3', 'ok', '3. Write succeeded');

        const back = await ref.get();
        const ms = Math.round(performance.now() - t0);
        if (back.exists() && back.val().stamp === stamp) {
          set('r4', 'ok', '4. Read it back correctly', 'Round trip: ' + ms + ' ms');
          document.getElementById('verdict').textContent = 'RESULT: PASS. Live quiz will work from here.';
        } else {
          set('r4', 'bad', '4. Read did not match what was written');
          document.getElementById('verdict').textContent = 'RESULT: FAIL at step 4';
        }
      } catch (e) {
        set('r3', 'bad', '3. Write failed', e.message + ' (usually the database rules; screenshot this)');
        document.getElementById('verdict').textContent = 'RESULT: FAIL at step 3';
      }
    });
  } catch (e) {
    set('r2', 'bad', '2. Setup error', e.message);
    document.getElementById('verdict').textContent = 'RESULT: FAIL at step 2';
  }
});
</script>
</body>
</html>
